#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
# The OpenHarmony Kotlin tasks are not configuration-cache compatible.
org.gradle.configuration-cache=false
org.gradle.caching=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#Kotlin Multiplatform / Native (OpenHarmony)
# The upstream default hierarchy template does not know about the ohos targets,
# so the source-set hierarchy is declared manually in sharedLogic/build.gradle.kts.
kotlin.mpp.applyDefaultHierarchyTemplate=false
# Commonize cinterop bindings across ohosArm64/ohosX64 so a single `ohosMain`
# source set can be shared by both targets.
kotlin.mpp.enableCInteropCommonization=true
# Disable the Kotlin/Native compiler caches for the ohos targets (see the
# KMP&CMP HarmonyOS release notes); harmless to leave on.
kotlin.native.cacheKind.ohosArm64=none
kotlin.native.cacheKind.ohosX64=none
